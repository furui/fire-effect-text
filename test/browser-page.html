<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FireText browser test</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; background: #07090f; }
      #host { width: 620px; height: 260px; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script src="/dist/fire-text.global.js"></script>
    <script>
      window.startFire = async function startFire(renderer, fallback) {
        if (window.fire) {
          window.fire.destroy();
          window.fire = null;
        }
        const host = document.getElementById("host");
        host.innerHTML = "";
        const fire = new FireTextBundle.FireText(host, {
          text: "TEST",
          fontSize: 120,
          width: 620,
          height: 260,
          simScale: 4,
          flameHeight: 1.1,
          fuel: 1.2,
          renderer: renderer,
          fallback: fallback !== false,
          background: "#07090f",
        });
        window.fire = fire;
        try {
          await fire.ready;
          return { ok: true, renderer: fire.renderer };
        } catch (error) {
          return {
            ok: false,
            renderer: fire.renderer,
            error: String(error && error.message ? error.message : error),
          };
        }
      };

      window.canvasStats = function canvasStats() {
        if (!window.fire) return null;
        const canvas = window.fire.canvas;
        const tmp = document.createElement("canvas");
        tmp.width = canvas.width;
        tmp.height = canvas.height;
        const ctx = tmp.getContext("2d");
        ctx.drawImage(canvas, 0, 0);
        const data = ctx.getImageData(0, 0, tmp.width, tmp.height).data;
        let sum = 0;
        let lit = 0;
        let count = 0;
        for (let y = 0; y < tmp.height; y += 4) {
          for (let x = 0; x < tmp.width; x += 4) {
            const i = (y * tmp.width + x) * 4;
            const luminance = (data[i] + data[i + 1] + data[i + 2]) / 3;
            sum += luminance;
            if (luminance > 14) lit += 1;
            count += 1;
          }
        }
        return {
          mean: sum / count,
          lit: lit / count,
          width: tmp.width,
          height: tmp.height,
        };
      };

      window.loseWebGLContext = function loseWebGLContext() {
        const backend = window.fire && window.fire.backend;
        const gl = backend && backend.gl;
        const ext = gl && gl.getExtension("WEBGL_lose_context");
        if (!ext) return false;
        ext.loseContext();
        return true;
      };
    </script>
  </body>
</html>
